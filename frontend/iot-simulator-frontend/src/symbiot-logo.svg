<svg width="120" height="155" viewBox="0 0 120 155" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <linearGradient id="textGradient" x1="0%" y1="0%" x2="100%" y2="0%">
      <stop offset="0%" style="stop-color:#2563EB;stop-opacity:1" />
      <stop offset="50%" style="stop-color:#3B82F6;stop-opacity:1" />
      <stop offset="100%" style="stop-color:#2563EB;stop-opacity:1" />
    </linearGradient>
    <filter id="glow">
      <feGaussianBlur stdDeviation="2" result="coloredBlur"/>
      <feMerge>
        <feMergeNode in="coloredBlur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- Background Circle -->
  <circle cx="60" cy="60" r="55" fill="url(#bgGradient)" stroke="#1D4ED8" stroke-width="3"/>

  <!-- IoT Network Visualization -->
  <g transform="translate(60, 60)" filter="url(#glow)">
    <!-- Central Hub (larger) -->
    <circle cx="0" cy="0" r="10" fill="#FFFFFF" stroke="#93C5FD" stroke-width="2.5"/>

    <!-- Outer Ring of Connected Nodes -->
    <!-- Top -->
    <circle cx="0" cy="-30" r="6" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
    <!-- Top Right -->
    <circle cx="26" cy="-15" r="6" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
    <!-- Bottom Right -->
    <circle cx="26" cy="15" r="6" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
    <!-- Bottom -->
    <circle cx="0" cy="30" r="6" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
    <!-- Bottom Left -->
    <circle cx="-26" cy="15" r="6" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>
    <!-- Top Left -->
    <circle cx="-26" cy="-15" r="6" fill="#DBEAFE" stroke="#60A5FA" stroke-width="2"/>

    <!-- Connection Lines from Hub to Nodes -->
    <line x1="0" y1="0" x2="0" y2="-30" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <line x1="0" y1="0" x2="26" y2="-15" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <line x1="0" y1="0" x2="26" y2="15" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <line x1="0" y1="0" x2="0" y2="30" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <line x1="0" y1="0" x2="-26" y2="15" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>
    <line x1="0" y1="0" x2="-26" y2="-15" stroke="#FFFFFF" stroke-width="2.5" opacity="0.8"/>

    <!-- Small decorative data pulses (small dots on connection lines) -->
    <circle cx="0" cy="-15" r="2" fill="#FCD34D" opacity="0.9"/>
    <circle cx="13" cy="-7" r="2" fill="#FCD34D" opacity="0.9"/>
    <circle cx="13" cy="7" r="2" fill="#FCD34D" opacity="0.9"/>
  </g>

  <!-- Circuit Board Corner Accents -->
  <g opacity="0.6">
    <!-- Top Left -->
    <circle cx="15" cy="15" r="3" fill="#93C5FD"/>
    <line x1="15" y1="18" x2="15" y2="28" stroke="#93C5FD" stroke-width="2"/>
    <line x1="18" y1="15" x2="28" y2="15" stroke="#93C5FD" stroke-width="2"/>

    <!-- Top Right -->
    <circle cx="105" cy="15" r="3" fill="#93C5FD"/>
    <line x1="105" y1="18" x2="105" y2="28" stroke="#93C5FD" stroke-width="2"/>
    <line x1="102" y1="15" x2="92" y2="15" stroke="#93C5FD" stroke-width="2"/>

    <!-- Bottom Right -->
    <circle cx="105" cy="105" r="3" fill="#93C5FD"/>
    <line x1="105" y1="102" x2="105" y2="92" stroke="#93C5FD" stroke-width="2"/>
    <line x1="102" y1="105" x2="92" y2="105" stroke="#93C5FD" stroke-width="2"/>

    <!-- Bottom Left -->
    <circle cx="15" cy="105" r="3" fill="#93C5FD"/>
    <line x1="15" y1="102" x2="15" y2="92" stroke="#93C5FD" stroke-width="2"/>
    <line x1="18" y1="105" x2="28" y2="105" stroke="#93C5FD" stroke-width="2"/>
  </g>

  <!-- Stylish SymBIoT Text Below Icon -->
  <text x="60" y="145" font-family="Arial, Helvetica, sans-serif" font-size="24" font-weight="bold"
        fill="url(#textGradient)" text-anchor="middle" letter-spacing="2.2">
    SymBIoT
  </text>
</svg>
