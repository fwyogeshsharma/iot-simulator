server:
  port: 8080


spring:
  datasource:
    url: jdbc:h2:mem:iotdb;DB_CLOSE_DELAY=-1;MODE=PostgreSQL
    driverClassName: org.h2.Driver
    username: sa
    password:
  jpa:
    hibernate:
      ddl-auto: update
    show-sql: false

logging:
  level:
    com.example.iotsimulatorbackend: DEBUG
  file:
    name: backend.log
  pattern:
    console: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %-50logger{50} : %m%n"
    file: "%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %-50logger{50} : %m%n"
  logback:
    rollingpolicy:
      max-file-size: 10MB
      max-history: 7
      total-size-cap: 100MB


