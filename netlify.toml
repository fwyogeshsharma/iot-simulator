[build]
  # Base directory where your frontend application is located
  base = "frontend/iot-simulator-frontend"

  # Command to build your Angular application
  command = "npm install && npm run build"

  # Directory where your built application will be (output from ng build)
  publish = "dist/iot-simulator-frontend"

# Proxy API requests to your backend (avoids mixed content blocking)
[[redirects]]
  from = "/api/*"
  to = "http://34.93.247.3:3000/api/:splat"
  status = 200
  force = true

# Redirect all other requests to index.html for Angular routing
[[redirects]]
  from = "/*"
  to = "/index.html"
  status = 200

# Optional: Environment variables (if needed)
# [build.environment]
#   NODE_VERSION = "18"
#   NPM_VERSION = "9"

# Optional: Custom headers for security
[[headers]]
  for = "/*"
  [headers.values]
    X-Frame-Options = "DENY"
    X-XSS-Protection = "1; mode=block"
    X-Content-Type-Options = "nosniff"
    Referrer-Policy = "strict-origin-when-cross-origin"
